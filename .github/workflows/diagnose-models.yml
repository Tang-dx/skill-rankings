name: Diagnose GitHub Models
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check model inference from GitHub runner
        env:
          GH_MODEL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.GH_MODEL_TOKEN;
          for(const authenticated of [false,true]) {
            const response=await fetch('https://models.github.ai/inference/chat/completions',{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(45000),
              headers:{'Content-Type':'application/json','Accept':'application/json',...(authenticated?{Authorization:`Bearer ${token}`}:{})},
              body:JSON.stringify({model:'openai/gpt-4.1-mini',max_tokens:16,messages:[{role:'user',content:'Reply with the single word READY.'}]})
            });
            const body=await response.text();
            let data;try{data=JSON.parse(body);}catch{}
            const safe=value=>String(value??'').split(token).join('[REDACTED]').slice(0,400);
            console.log(JSON.stringify({authenticated,status:response.status,contentType:response.headers.get('content-type'),requestId:response.headers.get('x-github-request-id'),bytes:body.length,json:!!data,model:data?.model,completion:safe(data?.choices?.[0]?.message?.content),error:safe(data?.error?.message??data?.message),plainOK:body.trim()==='OK'}));
          }
          NODE
