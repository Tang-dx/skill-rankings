name: Repair Chinese summaries
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: skill-rankings-collector
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test metadata.test.mjs collector.test.mjs dynamic.test.mjs
      - run: node metadata-backfill.mjs data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node summary-backfill.mjs data --repair-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_API_STYLE: ${{ vars.SUMMARY_API_STYLE }}
      - run: node verify-feed.mjs data/rankings.json
      - run: node --test history-bundles.test.mjs && node history-bundles.mjs data
      - name: Save repaired descriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/summary-cache.json data/discovery-cache.json data/rankings.json data/daily data/history
          if ! git diff --cached --quiet; then
            git commit -m 'Repair Chinese descriptions without changing star observations'
            git push
          fi
