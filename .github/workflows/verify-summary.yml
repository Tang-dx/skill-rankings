name: Verify configured Chinese summary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate one summary from public repository description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_API_STYLE: ${{ vars.SUMMARY_API_STYLE }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {configuredSummaryGenerator,summarizeRanked} from './summary-model.mjs';
          const response=await fetch('https://api.github.com/repos/anthropics/skills',{headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(10000)});
          assert(response.ok,`Public repository HTTP ${response.status}`);
          const repo=await response.json();
          assert.equal(repo.full_name,'anthropics/skills');
          assert.equal(repo.private,false);
          assert(repo.description);
          const feed={daily:[{name:repo.full_name,url:repo.html_url,description:repo.description}],rising:[],failures:[]};
          await summarizeRanked({feed,cache:{entries:{}},readme:async()=>null,generate:configuredSummaryGenerator(),model:process.env.SUMMARY_MODEL});
          assert.equal(feed.failures.length,0,JSON.stringify(feed.failures));
          assert.equal(feed.daily[0].summary_source,'ai_grounded_summary_v1');
          console.log(JSON.stringify({verified:true,name:repo.full_name,summary_zh:feed.daily[0].summary_zh,model:feed.daily[0].summary_evidence.model}));
          NODE
