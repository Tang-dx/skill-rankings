# Inactive template: copy to .github/workflows/collect.yml in a dedicated DATA repository.
# Copy collector.mjs, collector.test.mjs, dynamic.mjs, dynamic.test.mjs and verify-feed.mjs to its root.
name: Collect Skill rankings
on:
  schedule:
    - cron: '7 4 * * *' # 12:07 Asia/Shanghai; allow source refresh after the observed 08:00 day boundary.
    - cron: '17 6 * * *' # Retry at 14:17 only if no successful midday report exists.
  workflow_dispatch:
    inputs:
      scheduled_check:
        description: 'External scheduled check: skip if a midday report already exists'
        type: boolean
        default: false
permissions:
  contents: write
  models: read
concurrency:
  group: skill-rankings-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Skip scheduled retry when midday report already exists
        id: freshness
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULED_CHECK: ${{ inputs.scheduled_check }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          let fresh=false;
          try {
            const feed=JSON.parse(readFileSync('data/rankings.json','utf8'));
            const now=new Date(),generated=new Date(feed.generated_at);
            const parts=date=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).format(date);
            fresh=Number.isFinite(+generated)&&generated<=now&&parts(generated).slice(0,10)===parts(now).slice(0,10)&&Number(parts(generated).slice(-2))>=12;
          } catch {}
          const scheduled=process.env.RUN_EVENT==='schedule'||process.env.SCHEDULED_CHECK==='true';
          const collect=!scheduled||!fresh;
          appendFileSync(process.env.GITHUB_OUTPUT,`collect=${collect}\n`);
          console.log(collect?'Collect a new report':'Midday report already saved; skip duplicate scheduled collection');
          NODE
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.collect == 'true'
        with:
          node-version: '22'
      - run: node --test collector.test.mjs dynamic.test.mjs summary-model.test.mjs
        if: steps.freshness.outputs.collect == 'true'
      - run: node dynamic.mjs --output data
        if: steps.freshness.outputs.collect == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
      - run: node summary-backfill.mjs data
        if: steps.freshness.outputs.collect == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
      - run: node verify-feed.mjs data/rankings.json
        if: steps.freshness.outputs.collect == 'true'
      - name: Save public repository metadata snapshots
        if: steps.freshness.outputs.collect == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovery-cache.json data/summary-cache.json data/rankings.json data/daily data/batches
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed Skill star snapshots'
            git push
          fi
