# Inactive template: copy to .github/workflows/collect.yml in a dedicated DATA repository.
# Deploy this template with the collector, summary, history, verifier and Skill card modules and their tests.
name: Collect Skill rankings
on:
  schedule:
    - cron: '17 0 * * *' # 08:17: refresh after the observed 08:00 source-day boundary.
    - cron: '17 2 * * *' # 10:17: retry only if no post-08:00 report exists.
  workflow_dispatch:
    inputs:
      cards_only:
        description: 'Continue the Skill card backfill from existing reports'
        type: boolean
        default: false
      scheduled_check:
        description: 'External scheduled check: skip if the post-08:00 report already succeeded'
        type: boolean
        default: false
permissions:
  contents: write
  models: read
concurrency:
  group: skill-rankings-collector
  cancel-in-progress: false
jobs:
  collect:
    if: inputs.cards_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      collected: ${{ steps.freshness.outputs.collect }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip duplicate collection after a successful morning report
        id: freshness
        env:
          RUN_EVENT: ${{ github.event_name }}
          SCHEDULED_CHECK: ${{ inputs.scheduled_check }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          let fresh=false;
          try {
            const feed=JSON.parse(readFileSync('data/rankings.json','utf8'));
            const now=new Date(),generated=new Date(feed.generated_at);
            const parts=date=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).format(date);
            fresh=Number.isFinite(+generated)&&generated<=now&&parts(generated).slice(0,10)===parts(now).slice(0,10)&&Number(parts(generated).slice(-2))>=8;
          } catch {}
          const scheduled=process.env.RUN_EVENT==='schedule'||process.env.SCHEDULED_CHECK==='true';
          const collect=!scheduled||!fresh;
          appendFileSync(process.env.GITHUB_OUTPUT,`collect=${collect}\n`);
          console.log(collect?'Collect a new report':'This morning phase already saved; skip duplicate scheduled collection');
          NODE
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.collect == 'true'
        with:
          node-version: '22'
      - run: node --test collector.test.mjs dynamic.test.mjs summary-model.test.mjs
        if: steps.freshness.outputs.collect == 'true'
      - run: node dynamic.mjs --output data
        if: steps.freshness.outputs.collect == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_API_STYLE: ${{ vars.SUMMARY_API_STYLE }}
      - run: node summary-backfill.mjs data
        if: steps.freshness.outputs.collect == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_API_STYLE: ${{ vars.SUMMARY_API_STYLE }}
      - run: node verify-feed.mjs data/rankings.json
        if: steps.freshness.outputs.collect == 'true'
      - run: node --test history-bundles.test.mjs && node history-bundles.mjs data
        if: steps.freshness.outputs.collect == 'true'
      - name: Save public repository metadata snapshots
        if: steps.freshness.outputs.collect == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovery-cache.json data/summary-cache.json data/rankings.json data/daily data/batches data/history
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed Skill star snapshots'
            git push
          fi
  cards:
    needs: collect
    if: |
      !cancelled() && (inputs.cards_only == true ||
      (needs.collect.result == 'success' && needs.collect.outputs.collected == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test skill-cards.test.mjs
      - name: Build Skill cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ vars.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_API_STYLE: ${{ vars.SUMMARY_API_STYLE }}
        run: node skill-cards.mjs data
      - run: node verify-feed.mjs --cards-only data
      - name: Save verified Skill cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Skill cards'
            git push
          fi
