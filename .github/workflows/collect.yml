# Inactive template: copy to .github/workflows/collect.yml in a dedicated DATA repository.
# Copy collector.mjs and collector.test.mjs to that repository's root first.
name: Collect Skill rankings
on:
  schedule:
    - cron: '0 12 * * *' # About 20:00 Asia/Shanghai; GitHub scheduling may be delayed.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skill-rankings-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test collector.test.mjs
      - run: node collector.mjs --discover --release-dates --output data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save public repository metadata snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/rankings.json data/daily
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed Skill star snapshots'
            git push
          fi
